<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stick Monitoring System</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="sr-only">
        <ul>
            <li><a href="#dashboard">Skip to Dashboard</a></li>
        </ul>
    </nav>

    <main id="dashboard">
        <header style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
            <div style="width: 60px; height: 60px;">
                <img src="assets/logo.svg" alt="Smart Stick Project Logo" style="width: 100%; height: 100%;">
            </div>
            <div>
                <h1 style="margin: 0;">Smart Stick Assistant</h1>
                <p style="margin: 0; color: #888;">Real-time Monitoring & Safety Dashboard</p>
            </div>
        </header>

        <section id="alert-container" class="status-card alert-active" aria-live="assertive">
            <h2 style="color: #FF3B30;">⚠️ Obstacle Detection</h2>
            <p id="obstacle-alert" style="font-size: 1.5rem; font-weight: bold;">
                Status: Scanning for obstacles...
            </p>
        </section>

        <section class="status-card" aria-live="polite">
            <h2>📍 Live GPS Tracking</h2>
            <p id="gps-status" style="font-family: monospace; font-size: 1.1rem;">
                Current Coordinates: Waiting for GPS lock...
            </p>
            <div id="map-area" style="height: 150px; background: #252525; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #555; border: 1px dashed #444;">
                Map View Initialized
            </div>
        </section>

        <section class="status-card">
            <h2>🛠️ Remote Actions</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <button id="trigger-voice" aria-label="Find my stick - Trigger audio ping">
                    Ping Stick
                </button>
                <button id="test-alert" style="background-color: #333;" onclick="alert('Testing system protocols...')">
                    Test System
                </button>
            </div>
        </section>
    </main>

    <script src="js/speech.js"></script>
    <script src="js/maps.js"></script>
    
    <script src="js/websocket.js"></script>
    
    <script src="js/app.js"></script>

</body>
</html>
